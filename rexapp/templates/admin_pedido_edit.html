{% extends "base.html" %}
{% block conteudo %}
<div class="container mt-5">
    <h2>Alterar Status do Pedido #{{ pedido.id }}</h2>
    <hr>
    
    <div class="card p-4 shadow-sm">
        <p><strong>Cliente:</strong> {{ pedido.usuario.nome }}</p>
        <p><strong>Produto:</strong> {{ pedido.produto.nome }}</p>
        <p><strong>Valor Total:</strong> R$ {{ pedido.preco_total }}</p>

        <form method="post">
            {% csrf_token %}
            <div class="mb-3">
                <label for="status" class="form-label">Status Atual do Pedido:</label>
                <select name="status" id="status" class="form-select">
                    {% for value, label in pedido.STATUS_CHOICES %}
                        <option value="{{ value }}" {% if pedido.status == value %}selected{% endif %}>
                            {{ label }}
                        </option>
                    {% endfor %}
                </select>
            </div>
            
            <div class="mt-4">
                <button type="submit" class="btn btn-success">Salvar Alterações</button>
                <a href="{% url 'admin_pedidos_list' %}" class="btn btn-secondary">Cancelar</a>
            </div>
        </form>
    </div>
</div>
{% endblock conteudo %}
