{% extends "base.html" %}
{% block conteudo %}
{% load static %}


<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalhes do Produto - {{Produto.nome}}</title>
</head>

<body>

    <main>
        <div class="product-detail-container">
            <div class="product-images">
                <img id = 'main-image' class="main-image" src='/media/{{imagens.0.imagem}}' alt="Premium Laptop"> 

                <div class="thumbnail-images">
                    <img src="/media/{{imagens.0.imagem}}" alt="Miniatura 1" onclick="changeMainImage('/media/{{imagens.0.imagem}}')">
                    <img src="/media/{{imagens.1.imagem}}" alt="Miniatura 2" onclick="changeMainImage('/media/{{imagens.1.imagem}}')">
                    <img src="/media/{{imagens.2.imagem}}" alt="Miniatura 3" onclick="changeMainImage('/media/{{imagens.2.imagem}}')">
                </div>
        
            </div>

            <div class="product-info">
                <h1 class="product-title">{{produto.nome}}</h1>
                <p class="product-price">{{produto.preco}}</p>
                <p class="product-description">{{produto.especificacoes}}</p>
                <button class="add-to-cart-btn">
                    <span>ADICIONAR AO CARRINHO</span>
                    <img src="{% static 'imagens/carrinho_produto.png' %}" height="20px" width="20px" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M6 2L3 6v14a2 2 0 002 2h14a2 2 0 002-2V6l-3-4" />
                    <line x1="3" y1="6" x2="21" y2="6" />
                    <path d="M16 10a4 4 0 01-8 0" />
                </button>
            </div>
        </div>

        </div>
        </div>
        <div class="product-rating-container">
            <div class="stars">
                <svg width="50" height="50" viewBox="0 0 24 24" fill="#FFD700" stroke="#FFD700" stroke-width="0.5">
                    <polygon
                        points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2" />
                </svg>
                <svg width="50" height="50" viewBox="0 0 24 24" fill="#FFD700" stroke="#FFD700" stroke-width="0.5">
                    <polygon
                        points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2" />
                </svg>
                <svg width="50" height="50" viewBox="0 0 24 24" fill="#FFD700" stroke="#FFD700" stroke-width="0.5">
                    <polygon
                        points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2" />
                </svg>
                <svg width="50" height="50" viewBox="0 0 24 24" fill="#FFD700" stroke="#FFD700" stroke-width="0.5">
                    <polygon
                        points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2" />
                </svg>
                <svg width="50" height="50" viewBox="0 0 24 24" fill="#FFD700" stroke="#FFD700" stroke-width="0.5">
                    <polygon
                        points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2" />
                </svg>
            </div>
            <textarea class="rating-textbox" placeholder="Digite seu comentário..." rows="4"></textarea>
            <button class="submit-rating-btn">ENVIAR</button>
        </div>

        <!--  
        <div class="product-specs">
            <h2 class="specs-title">Sobre o produto</h2>
            <p class="spec-item">Cor: galego</p>
            <p class="spec-item">Velocidade: de um dodo</p>
            <p class="spec-item">Dimensões: galo</p>
        </div>
         -->
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-ndDqU0Gzau9qJ1lfW4pNLlhNTkCfHzAVBReH9diLvGRem5+R9g2FzA8ZGN954O5Q"
        crossorigin="anonymous"></script>
    <script>
        function changeMainImage(src) {
            const mainImage = document.getElementById('main-image');
            if (mainImage) {
                mainImage.src = src;
          }
        }
    </script>
          
</body>

</html>
{% endblock %}
