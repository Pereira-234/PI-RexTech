{% extends "base.html" %}
{% block conteudo %}
{% load static %}

<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RexTech</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-LN+7fdVzj6u52u30Kp6M/trliBMCMKTyK833zpbD+pXdCLuTusPj697FH4R/5mcr" crossorigin="anonymous">
</head>
<body>
    <main>
        <div class="formcontainer2">
            {% if messages %}
            <div class="messages">
                {% for message in messages %}
                    <div class="alert {% if message.tags %}alert-{{ message.tags }}{% endif %}">{{ message }}</div>
                {% endfor %}
            </div>
            {% endif %}

            <form method="post" enctype="multipart/form-data" action="{% url 'sign-up' %}">
                {% csrf_token %}
                <h2>Crie sua conta</h2>
                <p>Preencha os campos para cadastrar a sua conta</p>

                <input type="text" name="nome" placeholder="Seu nome completo" required>

                <div class="flex-row">
                    <input type="date" name="nascimento" placeholder="Data de nascimento" />
                    <input type="text" name="cpf" placeholder="CPF" />
                </div>

                <input type="email" name="email" placeholder="E-mail" required />
                <input type="email" name="email_confirm" placeholder="Confirmar e-mail" required />

                <div class="flex-row">
                    <input type="password" name="senha" placeholder="Senha" required />
                    <input type="password" name="senha_confirm" placeholder="Confirmar senha" required />
                </div>

                <div class="captcha-box">
                    <input type="checkbox" id="captcha" name="captcha" />
                    <label for="captcha">Não sou um robô</label>
                </div>

                <label for="foto">Foto de perfil (opcional)</label>
                <input type="file" name="foto" id="foto" accept="image/*">

                <button type="submit" class="btn-green">CADASTRAR</button>
                <hr />
                <a href="{% url 'login' %}" class="btn-gray">LOGIN</a>
            </form>
        </div>
    </main>

  

{% endblock %}
