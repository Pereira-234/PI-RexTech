<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .produto-qtd-container {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  width: 200px; /* Largura apenas para demonstração */
}

.rotulo {
  font-weight: 600;
  color: #003366; /* Azul escuro similar à imagem */
  font-size: 14px;
}

.divisor {
  border: 0;
  border-top: 1px solid #e0e0e0;
  margin: 8px 0 12px 0;
}

/* Container dos botões alinhados lado a lado */
.controles {
  display: flex;
  align-items: center;
  gap: 8px; /* Espaço entre os elementos */
}

/* Estilo dos botões quadrados (+ e -) */
.btn-acao {
  width: 32px;
  height: 32px;
  background-color: white;
  border: 1px solid #ccc; /* Borda cinza */
  border-radius: 4px; /* Cantos arredondados */
  font-size: 18px;
  color: #333;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.2s;
}

.btn-acao:hover {
  border-color: #888;
  background-color: #f9f9f9;
}

/* Estilo do input numérico */
#qtd-numero {
  width: 30px;
  text-align: center;
  border: none;
  font-size: 16px;
  font-weight: 500;
  color: #003366;
  background: transparent;
  /* Remove as setinhas padrão do input number em alguns navegadores */
  -moz-appearance: textfield;
}
/* Hack para remover setinhas no Chrome/Safari */
#qtd-numero::-webkit-outer-spin-button,
#qtd-numero::-webkit-inner-spin-button {
  -webkit-appearance: none;
  margin: 0;
}

/* Estilo do botão de lixeira */
.btn-deletar {
  background: none;
  border: none;
  cursor: pointer;
  color: #666;
  margin-left: 10px; /* Um pouco mais afastado, como na imagem */
  display: flex;
  align-items: center;
}

.btn-deletar:hover {
  color: #d9534f; /* Fica vermelho ao passar o mouse */
}
    </style>
</head>

<body>
    <div class="produto-qtd-container">
  
      
        <hr class="divisor">
      
        <div class="controles">
          <button class="btn-acao" id="btn-menos">−</button>
          
          <input type="number" id="qtd-numero" value="2" min="1" readonly>
          
          <button class="btn-acao" id="btn-mais">+</button>
          
          <button class="btn-deletar" aria-label="Remover produto">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="3 6 5 6 21 6"></polyline>
              <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
            </svg>
          </button>
        </div>
      </div>

      <script>const inputQtd = document.getElementById('qtd-numero');
        const btnMais = document.getElementById('btn-mais');
    const btnMenos = document.getElementById('btn-menos');
    
    btnMais.addEventListener('click', () => {
      let valorAtual = parseInt(inputQtd.value);
      inputQtd.value = valorAtual + 1;
    });
    
    btnMenos.addEventListener('click', () => {
      let valorAtual = parseInt(inputQtd.value);
      // Impede que a quantidade seja menor que 1
      if (valorAtual > 1) {
        inputQtd.value = valorAtual - 1;
      }
    });</script>
    
</body>
</html>
